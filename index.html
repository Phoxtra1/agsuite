<!doctype html>
<html lang="en">
<head>

  <!-- Core Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Synchronous Theme Initializer -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('amineva_theme');
        var theme = (t === 'dark' || t === 'light') ? t : 'light';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
      } catch (e) {}
    })();
  </script>

  <!-- Page Title -->
  <title>Amineva Global - Connect. Verify. Grow</title>

  <!-- SEO -->
  <meta name="description" content="Bridging the gap between information and execution, delivering verified field insights that empower project owners, investors, institutions, and decision makers." />
  <meta name="author" content="Amineva Global" />

  <!-- Favicon -->
  <link rel="icon" href="/amv_logo.png?v=1" type="image/png">
  <link rel="shortcut icon" href="/amv_logo.png?v=1" type="image/png">
  <link rel="apple-touch-icon" href="/amv_logo.png">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1b2d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Amineva" />

  <!-- Open Graph (Facebook, LinkedIn etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Amineva Global - Connect. Verify. Grow" />
  <meta property="og:description" content="Bridging the gap between information and execution, delivering verified field insights that empower project owners, investors, institutions, and decision makers." />
  <meta property="og:image" content="https://www.amineva.com/amv_logo.png" />
  <meta property="og:url" content="https://www.amineva.com" />
  <meta property="og:site_name" content="Amineva Global" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Amineva Global - Connect. Verify. Grow" />
  <meta name="twitter:description" content="Bridging the gap between information and execution, delivering verified field insights that empower project owners, investors, institutions, and decision makers." />
  <meta name="twitter:site" content="@AminevaGlobal" />
  <meta name="twitter:image" content="https://www.amineva.com/amv_logo.png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Amineva Global",
    "url": "https://www.amineva.com",
    "logo": "https://www.amineva.com/amv_logo.png",
    "sameAs": [
      "https://twitter.com/AminevaGlobal"
    ]
  }
  </script>

</head>

<body>

  <div id="root"></div>

  <!-- React Entry -->
  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
